<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Explorer — Orders Dashboard · GCP</title>
<link rel="stylesheet" href="explorer.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="https://bganguly.github.io/#dashboard" class="back-link" id="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      Portfolio
    </a>
    <script>
      (function(){
        var ref = document.referrer;
        var base = ref ? new URL(ref).origin : 'https://bganguly.github.io';
        var link = document.getElementById('back-link');
        link.href = base + '/#dashboard';
        link.addEventListener('click', function(e) {
          e.preventDefault();
          var url = link.href;
          try { if (window.opener && !window.opener.closed) { window.opener.location.href = url; window.close(); return; } } catch(_) {}
          window.location.href = url;
        });
      })();
    </script>
    <div class="nav-right">
      <span class="nav-label">Orders Dashboard — GCP</span>
      <span class="nav-badge">Spring Boot 4.1 · Java 21 · GCP · Cloud Run</span>
    </div>
  </div>
</nav>

<div class="hero">
  <p class="hero-eyebrow">API Explorer</p>
  <h1>Live API — Orders Dashboard (GCP · Spring Boot 4.1)</h1>
  <p>Run real requests against the Spring Boot 3 REST API backed by PostgreSQL 16 with pg_bigm full-text search.</p>
  <div class="base-url-pill">
    <span class="dot"></span>
    <span id="base-url-label"></span>/api
  </div>
</div>

<div class="cards" id="cards"></div>

<script src="explorer.js"></script>
</body>
</html>
